# 用 DCloud 离线 SDK 在 GitHub 上打谷雨 APK（不用自己下 SDK、不用配 Android Studio）
name: 打包 APK
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/apk.yml', 'android-build/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 找 SDK 下载地址
        run: |
          B=https://nativesupport.dcloud.net.cn
          curl -sSL -A 'Mozilla/5.0' $B/AppDocs/download/android.html -o page.html
          echo ----- 页面里的链接; grep -oE 'https?://[^"'"'"' <>)]+' page.html | sort -u | head -60
          echo ----- 脚本; grep -oE '(src|href)="[^"]+\.js"' page.html | head -30
          : > all.txt; cat page.html >> all.txt
          for js in $(grep -oE '(src|href)="[^"]+\.js"' page.html | sed -E 's/^(src|href)="//; s/"$//'); do
            case "$js" in http*) u=$js;; /*) u=$B$js;; *) u=$B/AppDocs/download/$js;; esac
            curl -sSL -A 'Mozilla/5.0' "$u" >> all.txt || true
          done
          echo ----- 找到的压缩包
          grep -oE 'https?://[^"'"'"' <>)\\]+\.(zip|rar|7z)[^"'"'"' <>)\\]*' all.txt | sort -u | tee links.txt
      - name: 下 SDK
        run: |
          URL=$(grep -iE 'android' links.txt | grep -viE 'ios|uniapp-x|uts' | head -1)
          echo "URL=$URL"
          curl -sSL -o sdk.zip "$URL"
          ls -la sdk.zip
          mkdir sdk && cd sdk && unzip -q ../sdk.zip
      - name: 看结构
        run: |
          cd sdk
          find . -maxdepth 3 -type d | head -80
          echo ----- AS 工程
          AS=$(find . -type d -name 'HBuilder-Integrate-AS' | head -1); echo "AS=$AS"
          find "$AS" -maxdepth 3 | grep -v '/build/' | head -80
          echo ----- gradle
          for f in $(find "$AS" -name '*.gradle' -maxdepth 3) $(find "$AS" -name 'settings.gradle*' -maxdepth 2); do echo "=== $f"; cat "$f"; done
          echo ----- manifest / data
          M=$(find "$AS" -path '*simpleDemo/src/main/AndroidManifest.xml' | head -1); echo "=== $M"; cat "$M"
          for f in $(find "$AS" -path '*simpleDemo/src/main/assets/data/*' -type f); do echo "=== $f"; head -c 4000 "$f"; echo; done
          find "$AS" -path '*simpleDemo/src/main/assets/apps*' | head -20
          echo ----- libs
          ls -la "$AS"/simpleDemo/libs 2>/dev/null | head -40
          find . -name '*.aar' | head -80
